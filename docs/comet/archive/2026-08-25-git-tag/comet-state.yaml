    text: A3 `createTag(cwd, name)` 在 message 为空时执行 `git tag <name>` 创建轻量
      tag；message 非空时执行 `git tag -a <name> -m <message>` 创建附注 tag。
    result: passed
    reason:
      text: "createTag 中 annotate = message 非空 ? ['-a','-m',message] : []，argv 为
        ['tag',...annotate,name,...]；两个 tag 用例分别走了空与非空两条分支并得到相符的 subject。"
      truncated: false
