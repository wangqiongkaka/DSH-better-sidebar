    text: A1 `tags(cwd)` 返回 `{ name, subject }[]`，按 creatordate 倒序（最新创建在最前）；仓库没有 tag
      时返回空数组。
    result: passed
    reason:
      text: src/git.ts tags() 用 for-each-ref --sort=-creatordate 返回
        {name,subject}[]；tests/git.spec.ts 断言空仓库返回 [] 且两个 tag 按新→旧排列，Runtime
        pnpm test exit 0。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 附注 tag 的 `subject` 是附注消息首行；轻量 tag 的 `subject` 是其所指提交的 subject。
    result: passed
    reason:
      text: 同一用例断言附注 tag v0.2.0 的 subject 是 'second release'（附注首行），轻量 tag v0.1.0 的
        subject 是 'base commit'（所指提交），来自 %(contents:subject) 的 git 回退语义。
      truncated: false
