    text: A8 tag 名校验拒绝 git 本身不接受的名字——为空，以 `-`、`.`、`/` 开头，含空格、控制字符或 `~^:?*[\` 中任一字符，含
      `..`、`@{`、`//`，以 `/`、`.`、`.lock` 结尾——返回 `bad-request` 且不执行任何 git 命令。
    result: passed
    reason:
      text: requireTagName 拒绝 /^[-.\/]/、空白与控制字符与 ~^:?*[\、..、@{、//、以 / . .lock
        结尾；空名由其上游 requireString 以 bad-request 拒绝。tests/smoke.spec.ts 用 18 个非法名与
        3 个合法名断言，Runtime pnpm test exit 0。
      truncated: false
